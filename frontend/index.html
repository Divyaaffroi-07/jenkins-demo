<!DOCTYPE html>
<html>
<head>
    <title>Full Stack App</title>
</head>
<body>
    <h1>Frontend using Nginx</h1>
    <button onclick="getMessage()">Call Backend</button>
    <p id="result"></p>

    <script>
        function getMessage() {
            fetch('/api')
                .then(response => response.text())
                .then(data => document.getElementById('result').innerText = data);
        }
    </script>
</body>
</html>
